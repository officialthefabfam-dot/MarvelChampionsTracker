name: iOS Build

on:
  push:
    branches:
      - main
      - "foundation/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build for iPhone
        run: |
          xcodebuild \
            -project MarvelChampionsTracker.xcodeproj \
            -scheme MarvelChampionsTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/MarvelChampionsTracker.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload MarvelChampionsTracker-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MarvelChampionsTracker-unsigned-IPA
          path: build/MarvelChampionsTracker-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
